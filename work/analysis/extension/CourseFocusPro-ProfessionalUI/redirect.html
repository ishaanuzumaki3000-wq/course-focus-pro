<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back to Course</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="redirect-body">
  <article class="redirect-card focus-redirect-card">
    <img class="brand-icon redirect-target-icon" src="icons/icon.svg" alt="" aria-hidden="true">
    <p class="eyebrow">Stay Focused</p>
    <h1>Stay Focused</h1>
    <p class="redirect-source"><strong id="sourceName">This site</strong> tried to distract you.</p>
    <p class="redirect-returning">Returning to</p>
    <h2 id="courseName">your course</h2>
    <div class="redirect-count" id="countdown">3</div>
    <div class="top-actions">
      <button class="button primary" id="goNowBtn" type="button">Open Course Now</button>
      <button class="button secondary" id="dashboardBtn" type="button">Dashboard</button>
    </div>
  </article>
  <script type="module" src="redirect.js"></script>
</body>
</html>
